name: Flipkart Scraper

# Runs 3x/day (times below are in UTC — IST is UTC+5:30):
#   18:30 UTC = 12:00 AM IST (midnight)
#   02:30 UTC = 8:00 AM IST
#   10:30 UTC = 4:00 PM IST
# GitHub's scheduler can run a few minutes late during busy periods — that's normal.
on:
  schedule:
    - cron: '30 18 * * *'
    - cron: '30 2 * * *'
    - cron: '30 10 * * *'
  workflow_dispatch:   # lets you manually trigger a run from the GitHub Actions tab, for testing

permissions:
  contents: write   # needed so the workflow can commit the updated CSV back to the repo

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright pandas
          playwright install --with-deps chromium

      - name: Run scraper
        run: python playwright_scraper.py

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add flipkart_data.csv scrape_log.txt
          git diff --cached --quiet || git commit -m "Automated scrape: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase
          git push
