name: Flipkart Scraper

# Scheduling is handled externally via cron-job.org, which pings the
# GitHub API to trigger workflow_dispatch at 12am/8am/4pm IST — this is
# because GitHub's own native `schedule:` trigger is documented as
# "best effort" and was found to be unreliable for a newly-created workflow
# (delayed or skipped entirely, especially in the first day or two).
# Do NOT re-add a `schedule:` block here — if GitHub's native scheduler
# later self-resolves, it would fire ALONGSIDE the external trigger and
# produce duplicate rows at the same timestamp.
on:
  workflow_dispatch:   # triggered externally by cron-job.org, or manually from the Actions tab

permissions:
  contents: write   # needed so the workflow can commit the updated CSV back to the repo

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright pandas tzdata
          playwright install --with-deps chromium

      - name: Run scraper
        run: python playwright_scraper.py

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add flipkart_data.csv scrape_log.txt
          git diff --cached --quiet || git commit -m "Automated scrape: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase
          git push
